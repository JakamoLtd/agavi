name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 4.x (the version required by composer.json) needs PHP 7.x.
        # The each() function used internally by PHPUnit 4.x was removed in PHP 8.0.
        php-version: ['7.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, pcre, reflection, session, spl, tokenizer, xsl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --ignore-platform-reqs

      - name: Run PHPUnit
        run: php test/run-tests.php -c test/config/phpunit.xml
